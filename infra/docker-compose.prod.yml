# Production stack for a single VPS. See docs/DEPLOY.md.
#   docker compose -f infra/docker-compose.prod.yml --env-file .env.production up -d --build
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web, server]

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped

  server:
    build:
      context: ..
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgres://quad:${POSTGRES_PASSWORD}@postgres:5432/quad
      REDIS_URL: redis://redis:6379
      APP_SECRET: ${APP_SECRET}
      APP_ORIGIN: ${APP_ORIGIN}
      TRUST_PROXY: "true"
      ADMIN_EMAILS: ${ADMIN_EMAILS}
      MAIL_PROVIDER: ${MAIL_PROVIDER:-console}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: quad
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: quad
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quad"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Daily pg_dump kept for 14 days (the Privacy Policy promises this), optionally copied to R2.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    entrypoint: ["sh", "/backup.sh"]
    environment:
      PGHOST: postgres
      PGUSER: quad
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: quad
      RETENTION_DAYS: 14
      RCLONE_REMOTE: ${RCLONE_REMOTE:-}
      RCLONE_CONFIG_R2_TYPE: s3
      RCLONE_CONFIG_R2_PROVIDER: Cloudflare
      RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      RCLONE_CONFIG_R2_ENDPOINT: ${R2_ENDPOINT:-}
    volumes:
      - ./backup/backup.sh:/backup.sh:ro
      - backups:/backups
    depends_on:
      postgres: { condition: service_healthy }

  # Phase 2: TURN relay for video calls (coturn) gets added here.

volumes:
  caddy_data:
  caddy_config:
  pgdata:
  redisdata:
  backups:
