# Production stack for a single VPS. See docs/DEPLOY.md.
#   docker compose -f infra/docker-compose.prod.yml --env-file .env.production up -d --build
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web, server]

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped

  server:
    build:
      context: ..
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgres://quad:${POSTGRES_PASSWORD}@postgres:5432/quad
      REDIS_URL: redis://redis:6379
      APP_SECRET: ${APP_SECRET}
      APP_ORIGIN: ${APP_ORIGIN}
      TRUST_PROXY: "true"
      ADMIN_EMAILS: ${ADMIN_EMAILS}
      MAIL_PROVIDER: ${MAIL_PROVIDER:-console}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM}
      TURN_SECRET: ${TURN_SECRET}
      TURN_URLS: turn:${TURN_HOST}:3478?transport=udp,turn:${TURN_HOST}:3478?transport=tcp
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: quad
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: quad
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quad"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Daily pg_dump kept for 14 days (the Privacy Policy promises this), optionally copied to R2.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    entrypoint: ["sh", "/backup.sh"]
    environment:
      PGHOST: postgres
      PGUSER: quad
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: quad
      RETENTION_DAYS: 14
      RCLONE_REMOTE: ${RCLONE_REMOTE:-}
      RCLONE_CONFIG_R2_TYPE: s3
      RCLONE_CONFIG_R2_PROVIDER: Cloudflare
      RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      RCLONE_CONFIG_R2_ENDPOINT: ${R2_ENDPOINT:-}
    volumes:
      - ./backup/backup.sh:/backup.sh:ro
      - backups:/backups
    depends_on:
      postgres: { condition: service_healthy }

  # TURN relay for video calls. All call media goes through here (ICE policy "relay"),
  # so students never see each other's IP address. Host networking avoids Docker NAT on
  # the big UDP port range. Credentials are short-lived HMACs issued by the API.
  coturn:
    image: coturn/coturn:4.6-alpine
    restart: unless-stopped
    network_mode: host
    # Run turnserver directly: the image's default entrypoint re-evaluates every argument.
    entrypoint: ["turnserver"]
    command:
      - -n
      - --log-file=stdout
      - --listening-port=3478
      - --fingerprint
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET}
      - --realm=quad
      - --external-ip=${PUBLIC_IP}
      - --min-port=49160
      - --max-port=49660
      - --user-quota=6
      - --no-cli
      - --no-multicast-peers
      - --no-tlsv1
      - --no-tlsv1_1
      # Never relay into private networks (stops people probing your server's internals).
      - --denied-peer-ip=0.0.0.0-0.255.255.255
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=100.64.0.0-100.127.255.255
      - --denied-peer-ip=127.0.0.0-127.255.255.255
      - --denied-peer-ip=169.254.0.0-169.254.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255

volumes:
  caddy_data:
  caddy_config:
  pgdata:
  redisdata:
  backups:
